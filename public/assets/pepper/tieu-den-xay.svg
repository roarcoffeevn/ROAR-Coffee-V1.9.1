  <text x="200" y="286" text-anchor="middle" fill="#F8F5EF" font-family="Georgia, serif" font-size="14" font-weight="bold">TIÊU ĐEN</text>
  <text x="200" y="305" text-anchor="middle" fill="#F8F5EF" font-family="Georgia, serif" font-size="14" font-weight="bold">XAY MỊN</text>
