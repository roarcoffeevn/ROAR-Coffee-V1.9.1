      <stop offset="100%" stop-color="#06140D"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E3C787"/>
      <stop offset="50%" stop-color="#C6A667"/>
      <stop offset="100%" stop-color="#8C6D32"/>
    </linearGradient>
    <linearGradient id="glass1" x1="0" y1="0" x2="1" y2="0">
